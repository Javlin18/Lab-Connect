services:
  - type: web
    name: labconnect-web
    env: node
    plan: free
    buildCommand: pnpm install && npx turbo run build --filter=web
    startCommand: HOST=0.0.0.0 PORT=10000 node apps/web/.next/standalone/apps/web/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: PNPM_VERSION
        value: 10.x
      # Add your Next.js environment variables below in the Render Dashboard
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
